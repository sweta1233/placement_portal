<style>

body{background:var(--bg);font-family:'Segoe UI',system-ui,sans-serif;}
.sidebar{width:240px;min-height:100vh;background:linear-gradient(180deg,#1e3a5f 0%,#2563eb 100%);position:fixed;left:0;top:0;z-index:100;transition:.3s;}

.sidebar .logo{padding:20px;color:#fff;font-size:1.1rem;font-weight:700;border-bottom:1px solid rgba(255,255,255,.2);margin-bottom:10px;}
.main-content{margin-left:240px;padding:0;min-height:100vh;}
.topbar{background:#fff;padding:12px 24px;border-bottom:1px solid #e2e8f0;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:99;box-shadow:0 1px 3px rgba(0,0,0,.07);}

.stat-card{border-radius:14px;padding:20px;color:#fff;position:relative;overflow:hidden;}
.stat-card .icon{font-size:2rem;opacity:.3;position:absolute;right:16px;top:16px;}
.stat-card h2{font-size:2rem;font-weight:700;margin:0;}
.stat-card p{margin:4px 0 0;opacity:.85;font-size:.9rem;}
.badge-status{padding:4px 10px;border-radius:20px;font-size:.75rem;font-weight:600;}
.badge-pending{background:#fef3c7;color:#92400e;}
.badge-approved{background:#d1fae5;color:#065f46;}
.badge-rejected{background:#fee2e2;color:#991b1b;}
.badge-closed{background:#e2e8f0;color:#475569;}
.badge-applied{background:#dbeafe;color:#1e40af;}
.badge-shortlisted{background:#fef9c3;color:#854d0e;}
.badge-selected{background:#dcfce7;color:#166534;}
.badge-waiting{background:#e0e7ff;color:#3730a3;}
.badge-diff-easy{background:#d1fae5;color:#065f46;}
.badge-diff-medium{background:#fef9c3;color:#854d0e;}
.badge-diff-hard{background:#fee2e2;color:#991b1b;}
.oa-window-open{border-left:4px solid var(--success);}
.oa-window-upcoming{border-left:4px solid var(--secondary);}
.oa-window-expired{border-left:4px solid var(--danger);opacity:.75;}
.oa-question-card{border:1px solid #e2e8f0;border-radius:12px;padding:18px;}
.drive-card{border-left:4px solid var(--primary);transition:.2s;}
.drive-card:hover{transform:translateY(-2px);box-shadow:0 4px 12px rgba(0,0,0,.12);}
.login-page{min-height:100vh;position:relative;background:linear-gradient(180deg,rgba(15,23,42,.35),rgba(15,23,42,.45)),url('assets/bg-login.jpg') center/cover no-repeat;display:flex;align-items:center;justify-content:center;overflow-y:auto;padding:2rem 0;}
.login-card{background:rgba(255,255,255,.96);border-radius:20px;padding:40px;width:400px;box-shadow:0 20px 60px rgba(0,0,0,.35);backdrop-filter:blur(6px);}
.main-content{position:relative;background-size:cover;background-position:center;background-attachment:fixed;background-repeat:no-repeat;}
.main-content.role-admin{background-image:linear-gradient(rgba(241,245,249,.82),rgba(241,245,249,.86)),url('assets/bg-admin.jpg');}
.main-content.role-company{background-image:linear-gradient(rgba(241,245,249,.82),rgba(241,245,249,.86)),url('assets/bg-company.jpg');}

.page-body{position:relative;z-index:1;background:transparent;}
.login-logo{text-align:center;margin-bottom:24px;}
.login-logo h2{color:var(--primary);font-weight:700;}
.btn-primary{background:var(--primary);border-color:var(--primary);}
.btn-primary:hover{background:#1d4ed8;border-color:#1d4ed8;}
.table th{background:#f8fafc;font-weight:600;color:#475569;border-bottom:2px solid #e2e8f0;}
.search-bar{background:#fff;border:1px solid #e2e8f0;border-radius:8px;padding:8px 16px;display:flex;align-items:center;gap:8px;width:300px;}
.search-bar input{border:none;outline:none;width:100%;font-size:.9rem;}
.avatar{width:40px;height:40px;border-radius:50%;background:var(--primary);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:600;}
.empty-state{text-align:center;padding:60px 20px;color:#94a3b8;}

.profile-section{background:linear-gradient(135deg,#1e3a5f,#2563eb);color:#fff;border-radius:16px;padding:28px;margin-bottom:20px;}

/* ===== Landing Page ===== */
.landing{min-height:100vh;background:#fff;}
.landing-nav{position:sticky;top:0;z-index:200;background:rgba(15,23,42,.92);backdrop-filter:blur(8px);}

.landing-hero{position:relative;min-height:88vh;display:flex;align-items:center;justify-content:center;text-align:center;color:#fff;padding:60px 24px;background:linear-gradient(180deg,rgba(15,23,42,.72),rgba(30,58,95,.68)),url('assets/bg-login.jpg') center/cover no-repeat;}
.landing-hero-inner{max-width:720px;}
.landing-hero h1{font-size:clamp(2.1rem,5vw,3.4rem);font-weight:800;line-height:1.15;margin-bottom:18px;}
.landing-hero p{font-size:1.05rem;opacity:.92;max-width:600px;margin:0 auto;}
.landing-section{padding:72px 24px;}
.landing-section-alt{background:#f8fafc;}
.landing-container{max-width:1140px;margin:0 auto;}
.section-eyebrow{color:var(--primary);font-weight:700;letter-spacing:1.5px;font-size:.78rem;margin-bottom:8px;}
.section-title{font-weight:800;font-size:2rem;margin-bottom:14px;color:#0f172a;}
.section-lead{color:#64748b;max-width:680px;font-size:1.02rem;}
.feature-card{background:#fff;border:1px solid #e2e8f0;border-radius:16px;padding:28px 24px;height:100%;box-shadow:0 1px 4px rgba(0,0,0,.05);transition:.2s;}
.feature-card:hover{transform:translateY(-4px);box-shadow:0 12px 24px rgba(0,0,0,.08);}
.feature-icon{width:52px;height:52px;border-radius:14px;background:linear-gradient(135deg,var(--primary),#60a5fa);color:#fff;display:flex;align-items:center;justify-content:center;font-size:1.4rem;margin-bottom:16px;}
.feature-card h5{font-weight:700;margin-bottom:8px;}
.feature-card p{color:#64748b;font-size:.92rem;margin:0;}
.step-card{background:#fff;border:1px solid #e2e8f0;border-radius:14px;padding:22px 18px;height:100%;position:relative;}
.step-num{width:32px;height:32px;border-radius:50%;background:var(--primary);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:.9rem;margin-bottom:12px;}
.step-card h6{font-weight:700;margin-bottom:6px;}
.step-card p{color:#64748b;font-size:.85rem;margin:0;}
.landing-footer{background:#0f172a;color:rgba(255,255,255,.75);padding:22px 24px;font-size:.9rem;}
</style>
</head>
<body>
<div id="app"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script>
const { createApp, ref, reactive, computed, onMounted, watch, nextTick } = Vue;

// ==================== API ====================
const API = {
  token: localStorage.getItem('pp_token'),
  headers() {
    return { 'Content-Type': 'application/json', 'Authorization': `Bearer ${this.token}` };
  },
  async req(method, url, data, multipart) {
    const opts = { method, headers: multipart ? { 'Authorization': `Bearer ${this.token}` } : this.headers() };
    if (data && !multipart) opts.body = JSON.stringify(data);
    if (data && multipart) opts.body = data;
    const res = await fetch(url, opts);
    const json = await res.json().catch(() => ({}));
    if (!res.ok) throw new Error(json.error || 'Request failed');
    return json;
  },
  get: (url) => API.req('GET', url),
  post: (url, d) => API.req('POST', url, d),
  put: (url, d) => API.req('PUT', url, d),
  del: (url) => API.req('DELETE', url),
  postForm: (url, d) => API.req('POST', url, d, true),
};

// Convert a <input type="datetime-local"> value (local wall-clock, no tz)
// into a proper UTC ISO string to send to the backend.
function toUtcIso(localValue) {
  if (!localValue) return '';
  const d = new Date(localValue);
  if (isNaN(d.getTime())) return '';
  return d.toISOString();
}
// Convert a UTC ISO string (from the backend) into the local wall-clock
// value expected by <input type="datetime-local">.
function toLocalInputValue(isoString) {
  if (!isoString) return '';
  const d = new Date(isoString);
  if (isNaN(d.getTime())) return '';
  const pad = n => String(n).padStart(2, '0');
  return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}T${pad(d.getHours())}:${pad(d.getMinutes())}`;
}

// ==================== MAIN APP ====================
const App = {
  template: `
  <div>
    <!-- Notifications -->
    <div class="notification">
      <transition-group name="fade">
        <div v-for="n in notifications" :key="n.id" :class="'alert alert-'+n.type+' alert-dismissible shadow'" role="alert" style="margin-bottom:8px;">
          <i :class="'bi bi-'+(n.type==='success'?'check-circle':'exclamation-triangle')+' me-2'"></i>
          {{n.msg}}
          <button type="button" class="btn-close" @click="removeNotif(n.id)"></button>
        </div>
      </transition-group>
    </div>

    <!-- Auth Pages -->
    <div v-if="!user">
      <LandingPage v-if="authPage==='landing'" @goto="goToAuth" />
      <LoginPage v-else-if="authPage==='login'" @login="handleLogin" @goto="authPage=$event" />
      <RegisterPage v-else :presetRole="presetRole" @register="handleRegister" @goto="authPage=$event" />
    </div>

    <!-- Main App -->
    <div v-else class="d-flex">
      <!-- Sidebar -->
      <nav class="sidebar" :class="{open: sidebarOpen}">
        <div class="logo">
          <i class="bi bi-mortarboard-fill me-2"></i>PlacementPortal
        </div>
        <ul class="nav flex-column px-0">
          <template v-if="user.role==='admin'">
            <li><a class="nav-link" :class="{active:page==='dashboard'}" href="#" @click.prevent="page='dashboard'"><i class="bi bi-speedometer2"></i>Dashboard</a></li>
            <li><a class="nav-link" :class="{active:page==='companies'}" href="#" @click.prevent="page='companies'"><i class="bi bi-building"></i>Companies</a></li>
            <li><a class="nav-link" :class="{active:page==='students'}" href="#" @click.prevent="page='students'"><i class="bi bi-people"></i>Students</a></li>
            <li><a class="nav-link" :class="{active:page==='drives'}" href="#" @click.prevent="page='drives'"><i class="bi bi-briefcase"></i>Placement Drives</a></li>
            <li><a class="nav-link" :class="{active:page==='applications'}" href="#" @click.prevent="page='applications'"><i class="bi bi-file-earmark-text"></i>Applications</a></li>
            <li><a class="nav-link" :class="{active:page==='reports'}" href="#" @click.prevent="page='reports'"><i class="bi bi-bar-chart"></i>Reports & Stats</a></li>
          </template>
          <template v-if="user.role==='company'">
            <li><a class="nav-link" :class="{active:page==='dashboard'}" href="#" @click.prevent="page='dashboard'"><i class="bi bi-speedometer2"></i>Dashboard</a></li>
            <li><a class="nav-link" :class="{active:page==='drives'}" href="#" @click.prevent="page='drives'"><i class="bi bi-briefcase"></i>My Drives</a></li>
            <li><a class="nav-link" :class="{active:page==='applications'}" href="#" @click.prevent="page='applications'"><i class="bi bi-people"></i>Applications</a></li>
            <li><a class="nav-link" :class="{active:page==='oa'}" href="#" @click.prevent="page='oa'"><i class="bi bi-laptop"></i>Meetings & OA</a></li>
            <li><a class="nav-link" :class="{active:page==='profile'}" href="#" @click.prevent="page='profile'"><i class="bi bi-building-gear"></i>Company Profile</a></li>
          </template>
          <template v-if="user.role==='student'">
            <li><a class="nav-link" :class="{active:page==='dashboard'}" href="#" @click.prevent="page='dashboard'"><i class="bi bi-speedometer2"></i>Dashboard</a></li>
            <li><a class="nav-link" :class="{active:page==='drives'}" href="#" @click.prevent="page='drives'"><i class="bi bi-briefcase"></i>Placement Drives</a></li>
            <li><a class="nav-link" :class="{active:page==='applications'}" href="#" @click.prevent="page='applications'"><i class="bi bi-file-earmark-check"></i>My Applications</a></li>
            <li><a class="nav-link" :class="{active:page==='oa'}" href="#" @click.prevent="page='oa'"><i class="bi bi-laptop"></i>Meetings & OA</a></li>
            <li><a class="nav-link" :class="{active:page==='history'}" href="#" @click.prevent="page='history'"><i class="bi bi-clock-history"></i>History</a></li>
            <li><a class="nav-link" :class="{active:page==='companies'}" href="#" @click.prevent="page='companies'"><i class="bi bi-building"></i>Companies</a></li>
            <li><a class="nav-link" :class="{active:page==='profile'}" href="#" @click.prevent="page='profile'"><i class="bi bi-person-circle"></i>My Profile</a></li>
          </template>
        </ul>
        <div class="px-3 py-3 mt-auto">
          <div class="d-flex align-items-center gap-2 p-2 rounded" style="background:rgba(255,255,255,.1);">
            <div class="avatar" style="width:32px;height:32px;font-size:.8rem;">{{user.username[0].toUpperCase()}}</div>
            <div style="flex:1;min-width:0;">
              <div class="text-white fw-semibold" style="font-size:.8rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">{{user.username}}</div>
              <div style="font-size:.7rem;opacity:.7;color:#fff;">{{user.role}}</div>
            </div>
            <button class="btn btn-sm" style="color:rgba(255,255,255,.7);" @click="logout"><i class="bi bi-box-arrow-right"></i></button>
          </div>
        </div>
      </nav>

      <!-- Main -->
      <div class="main-content" :class="'role-'+user.role" style="flex:1;">
        <div class="topbar">
          <div class="d-flex align-items-center gap-3">
            <button class="btn btn-sm btn-outline-secondary d-md-none" @click="sidebarOpen=!sidebarOpen"><i class="bi bi-list"></i></button>
            <h5 class="mb-0 text-capitalize fw-semibold">{{pageTitle}}</h5>
          </div>
          <div class="d-flex align-items-center gap-3">
            <span class="badge rounded-pill" style="background:#dbeafe;color:#1e40af;">{{user.role.toUpperCase()}}</span>
            <div class="avatar">{{user.username[0].toUpperCase()}}</div>
          </div>
        </div>
        <div class="page-body">
          <!-- Admin Pages -->
          <AdminDashboard v-if="user.role==='admin' && page==='dashboard'" @notify="notify" />
          <AdminCompanies v-if="user.role==='admin' && page==='companies'" @notify="notify" />
          <AdminStudents v-if="user.role==='admin' && page==='students'" @notify="notify" />
          <AdminDrives v-if="user.role==='admin' && page==='drives'" @notify="notify" />
          <AdminApplications v-if="user.role==='admin' && page==='applications'" @notify="notify" />
          <AdminReports v-if="user.role==='admin' && page==='reports'" @notify="notify" />
          <!-- Company Pages -->
          <CompanyDashboard v-if="user.role==='company' && page==='dashboard'" :profile="profile" @notify="notify" />
          <CompanyDrives v-if="user.role==='company' && page==='drives'" @notify="notify" />
          <CompanyApplications v-if="user.role==='company' && page==='applications'" @notify="notify" />
          <CompanyOA v-if="user.role==='company' && page==='oa'" @notify="notify" />
          <CompanyProfile v-if="user.role==='company' && page==='profile'" :profile="profile" @notify="notify" @updated="fetchProfile" />
          <!-- Student Pages -->
          <StudentDashboard v-if="user.role==='student' && page==='dashboard'" :profile="profile" @notify="notify" @goto="page=$event" />
          <StudentDrives v-if="user.role==='student' && page==='drives'" @notify="notify" />
          <StudentApplications v-if="user.role==='student' && page==='applications'" @notify="notify" />
          <StudentOA v-if="user.role==='student' && page==='oa'" @notify="notify" />
          <StudentHistory v-if="user.role==='student' && page==='history'" @notify="notify" />
          <StudentCompanies v-if="user.role==='student' && page==='companies'" @notify="notify" />
          <StudentProfile v-if="user.role==='student' && page==='profile'" :profile="profile" @notify="notify" @updated="fetchProfile" />
        </div>
      </div>
    </div>
  </div>`,

  setup() {
    const user = ref(null);
    const profile = ref(null);
    const page = ref('dashboard');
    const authPage = ref('landing');
    const presetRole = ref('student');
    const notifications = ref([]);
    const sidebarOpen = ref(false);

    function goToAuth(target, role) {
      if (role) presetRole.value = role;
      authPage.value = target;
    }

    const pageTitle = computed(() => {
      const map = { dashboard: 'Dashboard', companies: 'Companies', students: 'Students', drives: 'Placement Drives', applications: 'Applications', reports: 'Reports & Stats', profile: 'My Profile', history: 'Placement History', oa: 'Meetings & OA' };
      return map[page.value] || page.value;
    });

    function notify(msg, type='success') {
      const id = Date.now();
      notifications.value.push({ id, msg, type });
      setTimeout(() => removeNotif(id), 4000);
    }
    function removeNotif(id) {
      notifications.value = notifications.value.filter(n => n.id !== id);
    }

    async function handleLogin({ token, user: u, profile: p }) {
      API.token = token;
      localStorage.setItem('pp_token', token);
      user.value = u;
      profile.value = p;
      page.value = 'dashboard';
    }

    async function handleRegister() {
      authPage.value = 'login';
      notify('Registration successful! Please login.');
    }

    async function fetchProfile() {
      try {
        const data = await API.get('/api/auth/me');
        user.value = data.user;
        profile.value = data.profile;
      } catch {}
    }

    function logout() {
      API.token = null;
      localStorage.removeItem('pp_token');
      user.value = null;
      profile.value = null;
      page.value = 'dashboard';
      authPage.value = 'landing';
    }

    onMounted(async () => {
      if (API.token) {
        try {
          const data = await API.get('/api/auth/me');
          user.value = data.user;
          profile.value = data.profile;
        } catch { localStorage.removeItem('pp_token'); API.token = null; }
      }
    });

    return { user, profile, page, authPage, presetRole, notifications, sidebarOpen, pageTitle, notify, removeNotif, handleLogin, handleRegister, fetchProfile, logout, goToAuth };
  }
};

// ==================== LANDING PAGE ====================
const LandingPage = {
  emits: ['goto'],
  template: `
  <div class="landing">
    <nav class="landing-nav">
      <div class="landing-nav-inner">
        <div class="landing-logo"><i class="bi bi-mortarboard-fill me-2"></i>PlacementPortal</div>
        <div class="landing-nav-links d-none d-md-flex">
          <a href="#about" @click="closeMenu">About</a>
          <a href="#students" @click="closeMenu">For Students</a>
          <a href="#companies" @click="closeMenu">For Companies</a>
        </div>
        <div class="d-flex align-items-center gap-2">
          <button class="btn btn-outline-light btn-sm" @click="$emit('goto','login')">Login</button>
          <button class="btn btn-primary btn-sm d-none d-sm-inline-block" @click="$emit('goto','register','student')">Get Started</button>
          <button class="btn btn-sm btn-outline-light d-md-none" @click="menuOpen=!menuOpen"><i class="bi bi-list"></i></button>
        </div>
      </div>
      <div v-if="menuOpen" class="landing-nav-mobile d-md-none">
        <a href="#about" @click="closeMenu">About</a>
        <a href="#students" @click="closeMenu">For Students</a>
        <a href="#companies" @click="closeMenu">For Companies</a>
      </div>
    </nav>

    <header class="landing-hero">
      <div class="landing-hero-inner">
        <span class="badge rounded-pill mb-3" style="background:rgba(255,255,255,.15);color:#fff;font-weight:500;letter-spacing:.5px;">CAMPUS RECRUITMENT, SIMPLIFIED</span>
        <h1>Where Talent Meets Opportunity</h1>
        <p>One platform for your campus placement cell, recruiting companies and students &mdash; approvals, drives, applications and reports, all in one place.</p>
        <div class="d-flex flex-wrap gap-3 justify-content-center mt-4">
          <button class="btn btn-light btn-lg fw-semibold px-4" @click="$emit('goto','register','student')"><i class="bi bi-mortarboard me-2"></i>Register as Student</button>

    const viewingStudent = ref(null);
    const form = reactive({ drive_name:'', job_title:'', job_description:'', eligibility_branch:'', eligibility_cgpa:0, eligibility_year:'', application_deadline:'', salary:'', location:'', interview_type:'In-person' });

    async function fetch() {
      loading.value = true;

        closeModal(); fetch();
      } catch(e) { emit('notify',e.message,'danger'); }
      saving.value = false;
    }
    async function closeDrive(id) {
      if (!confirm('Close this drive?')) return;
      try { await API.put(`/api/company/drives/${id}`, { status:'closed' }); emit('notify','Drive closed'); fetch(); }
      catch(e) { emit('notify',e.message,'danger'); }

    async function viewApps(d) {
      selectedDrive.value = d; appLoading.value = true;
      try { driveApps.value = await API.get(`/api/company/drives/${d.id}/applications`); }
      catch(e) { emit('notify',e.message,'danger'); }
      appLoading.value = false;
    }
    async function updateApp(appId, status) {
      try { await API.put(`/api/company/applications/${appId}`, { status }); emit('notify','Status updated'); if(selectedDrive.value) viewApps(selectedDrive.value); }
      catch(e) { emit('notify',e.message,'danger'); }
    }
    onMounted(fetch);
    return { drives, loading, showModal, saving, editingDrive, form, selectedDrive, driveApps, appLoading, viewingStudent, fetch, editDrive, closeModal, saveDrive, closeDrive, viewApps, updateApp };
  }
};

        </div>
      </div></div>
    </div>
  </div>`,
  setup(props, { emit }) {
    const drives = ref([]); const apps = ref([]); const loading = ref(true); const selectedDriveId = ref('');
    const viewingStudent = ref(null);
    async function loadApps() {
      if (selectedDriveId.value) {
        apps.value = await API.get(`/api/company/drives/${selectedDriveId.value}/applications`);
      } else {
        const all = [];
        for (const d of drives.value) {
          try {
            const a = await API.get(`/api/company/drives/${d.id}/applications`);
            all.push(...a);
          } catch(e) { /* skip drives that fail to load */ }
        }
        apps.value = all;
      }
    }
    async function update(id, status) {
      try { await API.put(`/api/company/applications/${id}`, { status }); emit('notify','Updated'); loadApps(); }
      catch(e) { emit('notify',e.message,'danger'); }
    }
    onMounted(async () => {
      try { drives.value = await API.get('/api/company/drives'); await loadApps(); }
      catch(e) { emit('notify',e.message,'danger'); }
      loading.value = false;
    });
    return { drives, apps, loading, selectedDriveId, viewingStudent, loadApps, update };

};

  setup(props, { emit }) {
    const drives = ref([]); const selectedDriveId = ref('');
    const applications = ref([]); const loadingApps = ref(false);
    const oaList = ref([]); const loadingOa = ref(false);
    const meetingsByApp = reactive({});

    const meetingModal = reactive({ open: false, app: null });
    const meetingForm = reactive({ title: 'Interview', scheduled_at: '', duration_minutes: 30, meeting_link: '', notes: '' });
    const savingMeeting = ref(false);

    const oaModal = reactive({ open: false });
    const oaForm = reactive({ title: '', scheduled_at: '', duration_minutes: 90, question_source: 'leetcode', instructions: '' });
    const savingOa = ref(false);

    const questionsModal = reactive({ open: false, oa: null });
    const questions = ref([]);
    const qForm = reactive({ difficulty: 'easy', title: '', link: '', description: '' });

    const resultsModal = reactive({ open: false, oa: null });
    const attempts = ref([]); const loadingResults = ref(false);
    const expandedAttempt = ref(null);

    async function openResultsModal(o) {
      resultsModal.oa = o; resultsModal.open = true; expandedAttempt.value = null;
      loadingResults.value = true;
      try { attempts.value = await API.get(`/api/company/oa/${o.id}/attempts`); }
      catch(e) { emit('notify', e.message, 'danger'); }
      loadingResults.value = false;
    }

    async function loadDrives() {
      try { drives.value = await API.get('/api/company/drives'); } catch(e) { emit('notify', e.message, 'danger'); }
    }
    async function onDriveChange() {
      if (!selectedDriveId.value) return;
      loadingApps.value = true; loadingOa.value = true;
      try {
        const [apps, meetings, oas] = await Promise.all([
          API.get(`/api/company/drives/${selectedDriveId.value}/applications`),
          API.get(`/api/company/drives/${selectedDriveId.value}/meetings`),
          API.get(`/api/company/drives/${selectedDriveId.value}/oa`),
        ]);
        applications.value = apps;
        Object.keys(meetingsByApp).forEach(k => delete meetingsByApp[k]);
        meetings.forEach(m => meetingsByApp[m.application_id] = m);
        oaList.value = oas;
      } catch(e) { emit('notify', e.message, 'danger'); }
      loadingApps.value = false; loadingOa.value = false;
    }

    function openMeetingModal(a) {
      meetingModal.app = a; meetingModal.open = true;
      const existing = meetingsByApp[a.id];
      Object.assign(meetingForm, existing ? {
        title: existing.title, scheduled_at: toLocalInputValue(existing.scheduled_at),
        duration_minutes: existing.duration_minutes, meeting_link: existing.meeting_link, notes: existing.notes
      } : { title: 'Interview', scheduled_at: '', duration_minutes: 30, meeting_link: '', notes: '' });
    }
    async function saveMeeting() {
      if (!meetingForm.scheduled_at) { emit('notify','Pick a date & time','danger'); return; }
      savingMeeting.value = true;
      try {
        const payload = { ...meetingForm, scheduled_at: toUtcIso(meetingForm.scheduled_at) };
        await API.post(`/api/company/applications/${meetingModal.app.id}/meeting`, payload);
        emit('notify', 'Meeting scheduled'); meetingModal.open = false; onDriveChange();
      } catch(e) { emit('notify', e.message, 'danger'); }
      savingMeeting.value = false;
    }

    function openOaModal() {
      Object.assign(oaForm, { title: '', scheduled_at: '', duration_minutes: 90, question_source: 'leetcode', instructions: '' });
      oaModal.open = true;
    }
    async function saveOa() {
      if (!oaForm.title || !oaForm.scheduled_at) { emit('notify','Title and date/time are required','danger'); return; }
      savingOa.value = true;
      try {
        const payload = { ...oaForm, scheduled_at: toUtcIso(oaForm.scheduled_at) };
        await API.post(`/api/company/drives/${selectedDriveId.value}/oa`, payload);
        emit('notify', 'OA scheduled'); oaModal.open = false; onDriveChange();
      } catch(e) { emit('notify', e.message, 'danger'); }
      savingOa.value = false;
    }
    async function deleteOa(id) {
      if (!confirm('Delete this OA schedule?')) return;
      try { await API.del(`/api/company/oa/${id}`); emit('notify','OA deleted'); onDriveChange(); }
      catch(e) { emit('notify', e.message, 'danger'); }
    }

    async function openQuestionsModal(o) {
      questionsModal.oa = o; questionsModal.open = true;
      try { questions.value = await API.get(`/api/company/oa/${o.id}/questions`); }
      catch(e) { emit('notify', e.message, 'danger'); }
    }
    async function addQuestion() {
      if (!qForm.title) { emit('notify','Question title is required','danger'); return; }
      try {
        await API.post(`/api/company/oa/${questionsModal.oa.id}/questions`, qForm);
        Object.assign(qForm, { difficulty: 'easy', title: '', link: '', description: '' });
        questions.value = await API.get(`/api/company/oa/${questionsModal.oa.id}/questions`);
        onDriveChange();
      } catch(e) { emit('notify', e.message, 'danger'); }
    }
    async function removeQuestion(qid) {
      try {
        await API.del(`/api/company/oa/${questionsModal.oa.id}/questions/${qid}`);
        questions.value = questions.value.filter(q => q.id !== qid);
        onDriveChange();
      } catch(e) { emit('notify', e.message, 'danger'); }
    }

    onMounted(loadDrives);
    return {
      drives, selectedDriveId, applications, loadingApps, oaList, loadingOa, meetingsByApp,
      meetingModal, meetingForm, savingMeeting, oaModal, oaForm, savingOa,
      questionsModal, questions, qForm,
      resultsModal, attempts, loadingResults, expandedAttempt, openResultsModal,
      onDriveChange, openMeetingModal, saveMeeting, openOaModal, saveOa, deleteOa,
      openQuestionsModal, addQuestion, removeQuestion,
    };
  }
};

        exportJobId.value = r.job_id; exportStatus.value = 'pending';

            <div class="mt-3">
              <label class="form-label small fw-semibold mb-1">Status</label>

              </select>

              <label class="form-label small fw-semibold mb-1">Paste your code</label>

  setup(props, { emit }) {
    const meetings = ref([]); const loadingMeetings = ref(true);
    const oaList = ref([]); const loadingOa = ref(true);
    const starting = ref(null); const submitting = ref(false);
    const activeAttempt = ref(null);
    const responses = ref([]);

    async function loadMeetings() {
      loadingMeetings.value = true;
      try { meetings.value = await API.get('/api/student/meetings'); }
      catch(e) { emit('notify', e.message, 'danger'); }
      loadingMeetings.value = false;
    }
    async function loadOa() {
      loadingOa.value = true;
      try { oaList.value = await API.get('/api/student/oa'); }
      catch(e) { emit('notify', e.message, 'danger'); }
      loadingOa.value = false;
    }
    async function startOa(o) {
      starting.value = o.id;
      try {
        // Verification step (eligibility + timing) happens server-side.
        const r = await API.post(`/api/student/oa/${o.id}/start`);
        activeAttempt.value = r;
        responses.value = r.questions.map(q => ({ title: q.title, status: 'skipped', code: '', language: '' }));
        emit('notify', 'Verified! Your 3 questions are ready.');
      } catch(e) { emit('notify', e.message, 'danger'); }
      starting.value = null;
    }
    async function submitOa() {
      const unmarked = responses.value.filter(r => r.status === 'solved' && !r.code.trim());
      if (unmarked.length && !confirm('Some questions marked "Solved" have no code pasted in. Submit anyway?')) return;
      submitting.value = true;
      try {
        const r = await API.post(`/api/student/oa/${activeAttempt.value.oa.id}/complete`, { responses: responses.value });
        emit('notify', `OA submitted — you solved ${r.score}/${r.total_questions}`);
        activeAttempt.value = null; responses.value = [];
        loadOa();
      } catch(e) { emit('notify', e.message, 'danger'); }
      submitting.value = false;
    }
    onMounted(() => { loadMeetings(); loadOa(); });
    return { meetings, loadingMeetings, oaList, loadingOa, starting, submitting, activeAttempt, responses, startOa, submitOa };
  }
};

        <div class="card p-4 h-100 drive-card">

            <div class="avatar" style="width:48px;height:48px;font-size:1.2rem;flex-shrink:0;">{{c.company_name[0]}}</div>
            <div><h6 class="fw-bold mb-0">{{c.company_name}}</h6><div class="text-muted small">{{c.industry||'—'}}</div></div>
          </div>
          <p class="text-muted small">{{(c.description||'').slice(0,100)}}{{c.description && c.description.length>100?'...':''}}</p>
          <div class="small text-muted mt-auto">
            <div v-if="c.website"><i class="bi bi-globe me-1"></i><a :href="c.website" target="_blank">{{c.website}}</a></div>
            <div><i class="bi bi-envelope me-1"></i>{{c.hr_email||c.email||'—'}}</div>
          </div>
          <button class="btn btn-outline-primary btn-sm mt-3" @click="viewCompany(c)">View Details & Drives</button>
        </div>
      </div>
    </div>

    <!-- Company Detail Modal -->
    <div v-if="selectedCompany" class="modal d-block" style="background:rgba(0,0,0,.5);overflow-y:auto;">
      <div class="modal-dialog modal-lg"><div class="modal-content">
        <div class="modal-header"><h5 class="modal-title">{{selectedCompany.company_name}}</h5><button class="btn-close" @click="selectedCompany=null"></button></div>
        <div class="modal-body">
          <div class="row g-3 mb-4">
            <div class="col-md-8"><p>{{selectedCompany.description||'No description.'}}</p></div>
            <div class="col-md-4 small">
              <div class="mb-1"><strong>Industry:</strong> {{selectedCompany.industry||'—'}}</div>
              <div class="mb-1"><strong>HR:</strong> {{selectedCompany.hr_name||'—'}}</div>
              <div class="mb-1"><strong>Email:</strong> {{selectedCompany.hr_email||'—'}}</div>
              <div v-if="selectedCompany.website"><strong>Web:</strong> <a :href="selectedCompany.website" target="_blank">{{selectedCompany.website}}</a></div>
            </div>
          </div>
          <h6 class="fw-bold">Open Drives</h6>
          <div v-if="!selectedCompany.drives || selectedCompany.drives.length===0" class="text-muted small">No open drives currently.</div>
          <div v-else class="row g-2">
            <div v-for="d in selectedCompany.drives" :key="d.id" class="col-md-6">
              <div class="card p-3 drive-card"><div class="fw-semibold">{{d.drive_name}}</div><div class="text-muted small">{{d.job_title}} • {{d.location||'—'}}</div></div>
            </div>
          </div>
        </div>
      </div></div>
    </div>
  </div>`,
  setup(props, { emit }) {
    const companies = ref([]); const loading = ref(true); const search = ref(''); const selectedCompany = ref(null);
    async function fetch() {
      loading.value = true;
      try { companies.value = await API.get(`/api/student/companies?search=${search.value}`); }
      catch(e) { emit('notify',e.message,'danger'); }
      loading.value = false;
    }
    async function viewCompany(c) {
      try { selectedCompany.value = await API.get(`/api/student/companies/${c.id}`); }
      catch(e) { emit('notify',e.message,'danger'); }
    }
    onMounted(fetch);
    return { companies, loading, search, selectedCompany, fetch, viewCompany };
  }
};

// ==================== STUDENT PROFILE ====================
const StudentProfile = {
  props: ['profile'],
  emits: ['notify','updated'],
  template: `
  <div class="row g-4">
    <div class="col-md-8">
      <div class="card p-4">
        <h6 class="fw-bold mb-4">Edit Profile</h6>
        <div class="row g-3">
          <div class="col-6"><label class="form-label fw-semibold small">Full Name *</label><input v-model="form.full_name" class="form-control"></div>
          <div class="col-6"><label class="form-label fw-semibold small">Roll Number</label><input v-model="form.roll_number" class="form-control"></div>
          <div class="col-6"><label class="form-label fw-semibold small">Department</label><input v-model="form.department" class="form-control"></div>
          <div class="col-6"><label class="form-label fw-semibold small">Branch</label><input v-model="form.branch" class="form-control" placeholder="e.g. CSE"></div>
          <div class="col-3"><label class="form-label fw-semibold small">Year</label><select v-model="form.year" class="form-select"><option value="1">1st</option><option value="2">2nd</option><option value="3">3rd</option><option value="4">4th</option></select></div>
          <div class="col-3"><label class="form-label fw-semibold small">CGPA</label><input v-model="form.cgpa" type="number" step="0.01" min="0" max="10" class="form-control"></div>
          <div class="col-6"><label class="form-label fw-semibold small">Phone</label><input v-model="form.phone" class="form-control"></div>
          <div class="col-12"><label class="form-label fw-semibold small">Skills (comma-separated)</label><input v-model="form.skills" class="form-control" placeholder="Python, Java, React..."></div>
          <div class="col-12"><label class="form-label fw-semibold small">About</label><textarea v-model="form.about" class="form-control" rows="3" placeholder="Tell companies about yourself..."></textarea></div>
        </div>
        <button class="btn btn-primary mt-3" @click="save" :disabled="saving">
          <span v-if="saving" class="spinner-border spinner-border-sm me-1"></span>Save Changes
        </button>
      </div>
    </div>
    <div class="col-md-4">
      <div class="card p-4">
        <h6 class="fw-bold mb-3">Resume Upload</h6>
        <div v-if="form.resume_filename" class="alert alert-success py-2 small">
          <i class="bi bi-file-earmark-pdf me-1"></i>{{form.resume_filename}}
        </div>
        <input type="file" ref="fileInput" accept=".pdf,.doc,.docx" class="form-control mb-3" @change="uploadResume">
        <p class="text-muted small">Upload PDF or DOC (max 16MB)</p>
      </div>
      <div class="card p-4 mt-3">
        <h6 class="fw-bold mb-3">Profile Completion</h6>
        <div v-for="f in completionFields" :key="f.key" class="d-flex align-items-center gap-2 mb-2">
          <i :class="'bi bi-'+(form[f.key]?'check-circle-fill text-success':'circle text-muted')"></i>
          <span class="small">{{f.label}}</span>
        </div>
        <div class="progress mt-3"><div class="progress-bar bg-success" :style="{width: completionPct+'%'}"></div></div>
        <div class="text-muted small mt-1 text-end">{{completionPct}}% complete</div>
      </div>
    </div>
  </div>`,
  setup(props, { emit }) {
    const form = reactive({});
    const saving = ref(false);
    const fileInput = ref(null);
    const completionFields = [
      { key:'full_name', label:'Full Name' },
      { key:'roll_number', label:'Roll Number' },
      { key:'department', label:'Department' },
      { key:'cgpa', label:'CGPA' },
      { key:'phone', label:'Phone' },
      { key:'skills', label:'Skills' },
      { key:'resume_filename', label:'Resume Uploaded' },
    ];
    const completionPct = computed(() => {
      const filled = completionFields.filter(f => form[f.key]).length;
      return Math.round(filled / completionFields.length * 100);
    });
    watch(() => props.profile, (p) => { if(p) Object.assign(form, p); }, { immediate: true });
    async function save() {
      saving.value = true;
      try { await API.put('/api/student/profile', form); emit('notify','Profile updated'); emit('updated'); }
      catch(e) { emit('notify',e.message,'danger'); }
      saving.value = false;
    }
    async function uploadResume() {
      const file = fileInput.value?.files[0];
      if (!file) return;
      const fd = new FormData();
      fd.append('resume', file);
      try { const r = await API.postForm('/api/student/profile/resume', fd); form.resume_filename = r.filename; emit('notify','Resume uploaded!'); }
      catch(e) { emit('notify',e.message,'danger'); }
    }
    return { form, saving, fileInput, completionFields, completionPct, save, uploadResume };
  }
};

// ==================== REGISTER & RUN ====================
const app = createApp(App);

// Register all components
const components = { LandingPage, LoginPage, RegisterPage, AdminDashboard, AdminCompanies, AdminStudents, AdminDrives, AdminApplications, AdminReports, CompanyDashboard, CompanyDrives, CompanyApplications, CompanyOA, CompanyProfile, StudentDashboard, StudentDrives, StudentApplications, StudentOA, StudentHistory, StudentCompanies, StudentProfile };
Object.entries(components).forEach(([name, comp]) => app.component(name, comp));

app.mount('#app');
</script>
